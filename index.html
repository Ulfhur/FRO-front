<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./scss/main.css">

    <title>HeroTavern - PixelVerse Studio</title>
</head>
<body>
    <header id="main-header" class="header-logged">
        <div class="collapse" id="header" data-bs-theme="primary">
            <div class="bg-primary p-4">
                <h1 class="text-body-emphasis h4">Menu</h1>
                <a href="#/profile" class="text-body-secondary">Mon profil</a>
                <a href="#/messaging" class="text-body-secondary">Messagerie</a>
                <span id="logoutBtn" class="text-body-secondary" style="cursor:pointer">Se déconnecter
                    <i class="bi bi-door-open"></i>
                </span>
            </div>
        </div>
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <button class="navbar-toggler" 
                    type="button" data-bs-toggle="collapse" 
                    data-bs-target="#header" aria-controls="header" 
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
    </header>

    <main id="main-page">
        </main>

    <footer class="footer">
        <img src="Images/LogoPVS.png" alt="logo_pvs" class="footer-img pt-4">
        <p class="footer-text">©2026 PixelVerse Studio, tous droits réservés.</p>
        <p class="footer-text pt-4">Mentions légales</p>
        <p class="footer-text">Conditions générales de vente</p>
    </footer>
    
    <script type="module" src="./js/Router.js"></script>
    <script type="module" src="./js/script/script.js"></script>
    <script type="module" src="./js/auth/logout.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
