<div id="createChar-window">

  <!-- Zone personnage -->
  <div id="character-zone">
    <div id="character">
      <img src="/Images/perso.png" id="base-character" alt="Base character">

        <div class="slot" data-slot="helmet"></div>
        <div class="slot" data-slot="armor"></div>
        <div class="slot" data-slot="legs"></div>
        <div class="slot" data-slot="weapon"></div>
        <div class="slot" data-slot="shield"></div>
    </div>
    </div>
</div>

  <!-- Zone inventaire -->
  <div id="inventory-zone">

    <!-- Catégories -->
    <div id="categories">
      <button class="category active" data-category="helmet">Casque</button>
      <button class="category" data-category="armor">Armure</button>
      <button class="category" data-category="legs">Jambières</button>
      <button class="category" data-category="weapon">Arme</button>
      <button class="category" data-category="shield">Bouclier</button>
    </div>

    <!-- Items -->
    <div id="inventory">
      <img src="/Images/casquePerso.png" class="item" data-category="helmet">
      <img src="/Images/armurePerso.png" class="item" data-category="armor">
      <img src="/Images/jambierePerso.png" class="item" data-category="legs">
      <img src="/Images/epeePerso.png" class="item" data-category="weapon">
      <img src="/Images/bouclierPerso.png" class="item" data-category="shield">
    </div>
  </div>
</div>
