<div class="hero-scene text-center text-white">
  <div class="hero-scene-content">
    <img src="/Images/Logo.png" alt="logo" class="pt-3">
    <h1 class="mb-4 pt-1">Hero Tavern</h1>
    <p class="pb-4">
      Ton application officielle pour gérer et customiser tes personnages
    </p>
  </div>
</div>
<h1 class="text-center mt-4 mb-4">Profil</h1>
<div class="container mt-5">
    <div class="stylish-container">
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-circle bg-secondary p-3">
                <i class="bi bi-person-fill h1"></i>
            </div>
            <div>
                <h2 id="user-pseudo">Chargement...</h2>
                <p class="mb-0 text-white-50" id="user-email"></p>
            </div>
        </div>
    </div>
</div>
<div class="stylish-container">
    <h2 id="profile-username">Mes personnages</h2>

    <div id="profile-state"></div>

    <div class="row col-12 d-flex justify-content-center gap-3"
         id="characters-container">
    </div>
    <div class="mt-4">
      <a href="#/createChar" >
        <button class="my-button">Créer</button>
      </a>
    </div>   
</div>
<div class="stylish-container">
    <h2 class="mb-4">Héros de la communauté</h2>
    
    <div class="row g-2 mb-4 align-items-end">
        <div class="col-md-4">
            <label class="form-label small text-white-50">Rechercher</label>
            <input type="text" id="filter-search" class="form-control bg-dark text-white border-secondary" placeholder="Nom du héros ou utilisateur...">
        </div>
        <div class="col-md-4">
            <label class="form-label small text-white-50">Trier par</label>
            <select id="filter-sort" class="form-select bg-dark text-white border-secondary">
                <option value="default">Plus récents</option>
                <option value="comments">Les plus populaires (Commentaires)</option>
                <option value="name">Ordre alphabétique</option>
            </select>
        </div>
    </div>       
    <div id="community-state"></div>
    <div class="row col-12 d-flex justify-content-center gap-3" id="community-characters-container">
        </div>
</div>
